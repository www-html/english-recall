name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate bundled content
        run: npm run validate:content

      - name: Build and verify root PWA
        run: |
          npm run build
          node scripts/verify-pwa.mjs dist /

      - name: Build and verify subpath PWA
        env:
          VITE_BASE_PATH: /english-recall/
        run: |
          npm run build
          node scripts/verify-pwa.mjs dist /english-recall/
